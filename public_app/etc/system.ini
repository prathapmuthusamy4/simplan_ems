;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; system.ini
; システムに関する設定ファイル
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;;;;;;;;;;;;;;;;;;;;
; BASE
;;;;;;;;;;;;;;;;;;;;
[BASE]
    ;; システム名
    system_name    = "powercis"
    ;; 初期アクセス、不正アクセス時のデフォルトプロセス
    default_process     = "index"
    default_cliprocess  = "default"

;;;;;;;;;;;;;;;;;;;;
; DB設定
;;;;;;;;;;;;;;;;;;;;
[DB]
    ;; DBタイプ ("none", "mysql")
    ;db_type   = "none"
    db_type     = "mysql"
    ;; DBサーバ名
    db_host     = "localhost"
    ;; DBポート番号
    db_port     = "3306"
    ;; DB名
    db_name      = "ems"
    ;; DBユーザ名
    db_user     = "root"
    ;; DBパスワード
    db_pass     = ""

; [DB]
;     ;; DBタイプ ("none", "mysql")
